version: "3.8"

services:
  api:
    build: .
    container_name: muchtodo-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:6
    container_name: muchtodo-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  redis:
    image: redis:7
    container_name: muchtodo-redis
    ports:
      - "6379:6379"